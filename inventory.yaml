all:
  vars:
    lvm_vg: data
    lvm_thinpool: pool
    lvm_local_lv: localcopy
    lvm_synctarget_lv: synctarget
    lvm_lv_size: "8G"
    synctarget_mountpoint: /synctarget
    sync_schedule: "19,39,59 * * * *"
    minikube_version: "1.35.0"
    kubernetes_version: "1.30.10"
  hosts:
    netbox:
      ansible_host: 10.144.64.231
      lvm_disk: /dev/sdb
      scale_targets:
        - target: deploy/hsrn-netbox
          namespace: hsrn-netbox
          nominal_replicas: 1
        - target: deploy/hsrn-netbox-worker
          namespace: hsrn-netbox
          nominal_replicas: 1
        - target: sts/hsrn-netbox-postgresql
          namespace: hsrn-netbox
          nominal_replicas: 1
        - target: sts/hsrn-netbox-redis-master
          namespace: hsrn-netbox
          nominal_replicas: 1

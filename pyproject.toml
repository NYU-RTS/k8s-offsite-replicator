[tool.poetry]
name = "k8s-replicator"
version = "0.1.0"
description = "Replicates a Kubernetes deployment on a remote machine"
authors = ["Remi Rampin <remi@rampin.org>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
kubernetes = "*"

[tool.poetry.scripts]
ceph-backup = "k8s_replicator:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
